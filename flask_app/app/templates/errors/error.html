{% extends "base.html" %}
{% block title %}{{ title }} — {{ branding.name }}{% endblock %}
{% block content %}
<div class="auth-card center">
  <p class="error-code">{{ status }}</p>
  <h1>{{ title }}</h1>

</div>
{% endblock %}
