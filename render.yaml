services:
  - type: web
    name: adm-cloud
    runtime: python
    rootDir: flask_app
    pythonVersion: 3.13.4
    buildCommand: pip install -r requirements.txt
    preDeployCommand: flask --app manage.py db upgrade
    startCommand: gunicorn --workers 2 --timeout 90 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /healthz
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: manage.py
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: adm-cloud-db
          property: connectionString
      - key: APP_NAME
        value: ADM Cloud
      - key: APP_BASE_URL
        value: https://adm-cloud.onrender.com
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: SMTP_USE_SSL
        value: "false"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false

databases:
  - name: adm-cloud-db